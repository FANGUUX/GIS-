<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIS 地理信息系统</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>🗺️ GIS 地理信息系统</h1>
            <div class="coordinates-display" id="coordinates">
                经度: - | 纬度: - | 缩放: -
            </div>
        </header>

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="panel">
                <h3>工具面板</h3>
                
                <!-- Layer Control -->
                <div class="control-group">
                    <h4>图层控制</h4>
                    <label>
                        <input type="radio" name="baseLayer" value="osm" checked>
                        <span>OpenStreetMap</span>
                    </label>
                    <label>
                        <input type="radio" name="baseLayer" value="satellite">
                        <span>卫星影像</span>
                    </label>
                    <label>
                        <input type="radio" name="baseLayer" value="terrain">
                        <span>地形图</span>
                    </label>
                </div>

                <!-- Tools -->
                <div class="control-group">
                    <h4>工具</h4>
                    <button id="addMarkerBtn" class="tool-btn">📍 添加标记</button>
                    <button id="measureDistanceBtn" class="tool-btn">📏 测量距离</button>
                    <button id="drawPolygonBtn" class="tool-btn">⬡ 绘制多边形</button>
                    <button id="clearAllBtn" class="tool-btn danger">🗑️ 清除所有</button>
                </div>

                <!-- Location -->
                <div class="control-group">
                    <h4>定位</h4>
                    <button id="locateBtn" class="tool-btn">📍 定位我的位置</button>
                    <input type="text" id="searchBox" placeholder="搜索地址或坐标..." class="search-input">
                    <button id="searchBtn" class="tool-btn">🔍 搜索</button>
                </div>

                <!-- Info -->
                <div class="control-group">
                    <h4>信息</h4>
                    <div id="infoPanel" class="info-panel">
                        点击地图查看信息
                    </div>
                </div>
            </div>
        </aside>

        <!-- Map Container -->
        <main class="map-container">
            <div id="map"></div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>
    
    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
